name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - pagesite
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Ensure the build uses the correct base for repo pages
      SITE_BASE: '/glowing-CV/'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Show SITE_BASE
        run: echo "SITE_BASE=${SITE_BASE}"

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "Inspecting dist/index.html..."
          ls -la dist
          head -n 40 dist/index.html
          if grep -q "src/main.js" dist/index.html; then
            echo "ERROR: dist/index.html still references src/main.js" >&2
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Validate deployed asset
        run: |
          # Extract asset path from built HTML and validate it's reachable and not HTML
          echo "Looking for JS asset in dist/index.html"
          asset=$(grep -o 'src="[^"]*assets\/[^"]*"' dist/index.html | head -n1 | sed -E 's/src="//' | sed -E 's/"$//')
          if [ -z "$asset" ]; then echo "ERROR: could not find asset in dist/index.html"; exit 1; fi
          echo "Using asset: $asset"
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://seguleh.github.io${asset}")
          headers=$(curl -s -I "https://seguleh.github.io${asset}")
          echo "HTTP status: $status"
          echo "$headers"
          if [ "$status" != "200" ]; then echo "ERROR: deployed asset not accessible (HTTP $status)"; exit 1; fi
          if echo "$headers" | grep -qi "text/html"; then echo "ERROR: deployed asset returned HTML content type"; exit 1; fi
